<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>IELTS Vocabulary Exam</title>

<style>

:root{
    --bg:#eef3f8;
    --card:#ffffff;
    --text:#172033;
    --muted:#667085;
    --primary:#2563eb;
    --border:#e5e7eb;
    --soft:#f7f9fc;
    --danger:#dc2626;
    --success:#16a34a;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.2s;
}

body.dark{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f1f5f9;
    --muted:#94a3b8;
    --border:#334155;
    --soft:#172033;
}

.container{
    max-width:900px;
    width:94%;
    margin:25px auto;
}

.card{
    background:var(--card);
    padding:28px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.hidden{
    display:none!important;
}

.center{
    text-align:center;
}

.brand{
    text-align:center;
    color:var(--primary);
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.lesson-row{
    display:flex;
    align-items:center;
    border:2px solid var(--border);
    border-radius:14px;
    margin:10px 0;
    overflow:hidden;
    background:var(--soft);
}

.lesson-name{
    flex:1;
    padding:17px;
    font-weight:bold;
    cursor:pointer;
}

.lesson-name:hover{
    color:var(--primary);
}

.lesson-divider{
    width:2px;
    align-self:stretch;
    background:var(--border);
}

.review-btn{
    width:65px;
    padding:17px 0;
    margin:0;
    border-radius:0;
    background:transparent;
}

.review-btn:hover{
    background:var(--border);
}

.telegram{
    margin-top:20px;
    text-align:center;
}

.telegram a{
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    color:#229ed9;
    font-weight:bold;
}

.telegram svg{
    width:22px;
    height:22px;
    fill:#229ed9;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.timer{
    font-size:28px;
    font-weight:bold;
    color:var(--primary);
    text-align:center;
    margin:10px 0;
}

.progress{
    color:var(--muted);
    font-weight:bold;
}

.meaning{
    padding:18px;
    border-radius:14px;
    background:var(--soft);
    border:1px solid var(--border);
    font-size:20px;
    font-weight:bold;
    margin:20px 0;
}

label{
    display:block;
    font-weight:bold;
    margin:18px 0 8px;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:2px solid var(--border);
    border-radius:12px;
    background:var(--card);
    color:var(--text);
    font-size:16px;
    outline:none;
}

textarea{
    min-height:130px;
    resize:vertical;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    margin:5px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.primary{
    background:var(--primary);
    color:white;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

body.dark .secondary{
    background:#334155;
    color:white;
}

.result-box{
    margin-top:20px;
    padding:20px;
    border-radius:16px;
    background:var(--soft);
    border:1px solid var(--border);
}

.score{
    font-size:48px;
    font-weight:bold;
    color:var(--primary);
}

.small{
    color:var(--muted);
}

.correct{
    color:var(--success);
    font-weight:bold;
}

.incorrect{
    color:var(--danger);
    font-weight:bold;
}

.grammar-error{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:#fff1f2;
    border:1px solid #fecdd3;
    color:#172033;
}

body.dark .grammar-error{
    background:#3f1d25;
    color:#f1f5f9;
    border-color:#7f1d1d;
}

.grammar-item{
    margin:10px 0;
    padding:12px;
    border-radius:10px;
    background:white;
    border:1px solid #e5e7eb;
}

body.dark .grammar-item{
    background:#1e293b;
    border-color:#475569;
}

.wrong-text{
    color:#dc2626;
    font-weight:bold;
}

.suggestion{
    color:#16a34a;
    font-weight:bold;
}

.band{
    font-size:48px;
    font-weight:bold;
    color:var(--primary);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:1000;
}

.modal-box{
    width:min(800px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--card);
    color:var(--text);
    border-radius:20px;
    padding:25px;
}

.review-item{
    padding:13px 0;
    border-bottom:1px solid var(--border);
}

.review-en{
    font-weight:bold;
}

.review-uz{
    color:var(--muted);
    margin-top:4px;
}

.theme-btn{
    font-size:20px;
    padding:8px 12px;
    margin:0;
}

.exam-mode{
    overflow:auto;
}

@media(max-width:600px){

    .container{
        width:96%;
        margin:12px auto;
    }

    .card{
        padding:20px;
    }

    button{
        width:100%;
        margin:5px 0;
    }

    .theme-btn{
        width:auto;
    }

    .score{
        font-size:40px;
    }
}

</style>
</head>

        </p>

    </div>

    <div class="center">

            onclick="newExam()"

            🔄 NEW EXAM
        </button>

    </div>

</div>

</div>

</div>

/* =====================================================
   SETTINGS
===================================================== */

const QUESTION_COUNT = 15;
const EXAM_TIME = 15 * 60;


/* =====================================================
   VARIABLES
===================================================== */

let selectedLesson = "";
let examQuestions = [];
let currentQuestion = 0;

let totalScore = 0;
let vocabScore = 0;
let sentenceScore = 0;

let answered = false;

let timer = null;
let timeLeft = EXAM_TIME;

let examActive = false;
let antiCheatLocked = false;


/* =====================================================
   BUILD LESSONS
===================================================== */

function buildLessons(){

    const list =
        document.getElementById("lessonList");

    list.innerHTML = "";

    Object.keys(lessons).forEach(lesson => {

        const row =
            document.createElement("div");

        row.className =
            "lesson-row";

        const name =
            document.createElement("div");

        name.className =
            "lesson-name";

        name.textContent =
            lesson;

        name.onclick =
            () => startExam(lesson);


        const divider =
            document.createElement("div");

        divider.className =
            "lesson-divider";


        const review =
            document.createElement("button");

        review.className =
            "review-btn";

        review.textContent =
            "📖";

        review.title =
            "Review vocabulary";

        review.onclick =
            (event) => {

                event.stopPropagation();

                openReview(lesson);

            };


        row.appendChild(name);
        row.appendChild(divider);
        row.appendChild(review);

        list.appendChild(row);

    });

}


/* =====================================================
   START EXAM
===================================================== */

function startExam(lesson){

    selectedLesson = lesson;

    examQuestions =
        [...lessons[lesson]]
        .sort(() => Math.random() - 0.5)
        .slice(0,QUESTION_COUNT);

    currentQuestion = 0;

    totalScore = 0;
    vocabScore = 0;
    sentenceScore = 0;

    answered = false;
    antiCheatLocked = false;

    timeLeft = EXAM_TIME;
    examActive = true;

    document.body.classList.add(
        "exam-mode"
    );

    document
        .getElementById("lessonPage")
        .classList.add("hidden");

    document
        .getElementById("resultPage")
        .classList.add("hidden");

    document
        .getElementById("examPage")
        .classList
        .remove("hidden");

    document
        .getElementById("examLesson")
        .textContent =
        selectedLesson;

    showQuestion();

    updateTimer();

    startTimer();

}


/* =====================================================

===================================================== */

function showQuestion(){

    const item =
        examQuestions[currentQuestion];

    answered = false;

    document
        .getElementById("questionNumber")
        .textContent =
        `Question ${currentQuestion + 1} / ${QUESTION_COUNT}`;

    document
        .getElementById("meaning")
        .textContent =
        "🇺🇿 " + item[1];

    document
        .getElementById("vocabAnswer")
        .value = "";

    document
        .getElementById("sentenceAnswer")
        .value = "";

    document
        .getElementById("questionFeedback")
        .classList
        .add("hidden");

    document
        .getElementById("questionFeedback")
        .innerHTML = "";

    document
        .getElementById("checkButton")
        .classList
        .remove("hidden");

    document
        .getElementById("nextButton")
        .classList
        .add("hidden");

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(){

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;

    document
        .getElementById("timer")
        .textContent =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}


function startTimer(){

    clearInterval(timer);

    timer =
        setInterval(() => {

            if(!examActive){

                clearInterval(timer);

                return;

            }

            timeLeft--;

            updateTimer();

            if(timeLeft <= 0){

                clearInterval(timer);

                finishExam(
                    "⏰ Time is over!"
                );

            }

        },1000);

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(text){

    return String(text)
        .toLowerCase()
        .trim()
        .replace(/[.,!?;:'"()]/g,"")
        .replace(/\s+/g," ");

}


/* =====================================================
   VOCAB CHECK
===================================================== */

function checkVocabulary(
    answer,
    correct
){

    return normalize(answer) ===
           normalize(correct);

}


/* =====================================================
   LANGUAGE TOOL
===================================================== */

async function grammarCheck(sentence){

    const body =
        new URLSearchParams();

    body.append(
        "text",
        sentence
    );

    body.append(
        "language",
        "en-US"
    );

    const response =
        await fetch(
            "https://api.languagetool.org/v2/check",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:
                    body.toString()
            }
        );

    if(!response.ok){

        throw new Error(
            "LanguageTool is unavailable."
        );

    }

    return await response.json();

}


/* =====================================================
   GET GRAMMAR DETAILS
===================================================== */

function createGrammarDetails(
    sentence,
    matches
){

    if(
        !matches ||
        matches.length === 0
    ){

        return "";

    }

    let html = `

        <div class="grammar-error">

            <h3>
                📝 LanguageTool corrections
            </h3>

            <p>
                Found
                <b>${matches.length}</b>
                issue(s):
            </p>

    `;


    matches.forEach(
        (match,index) => {

            const wrongText =
                sentence.substring(
                    match.offset,
                    match.offset +
                    match.length
                );


            let suggestions =
                "No suggestion";


            if(
                Array.isArray(
                    match.replacements
                ) &&
                match.replacements.length
            ){

                suggestions =
                    match.replacements
                        .slice(0,5)
                        .map(
                            item =>
                                item.value
                        )
                        .join(", ");

            }


            html += `

                <div class="grammar-item">

                    <b>
                        ${index + 1}.
                        ${escapeHTML(
                            match.message ||
                            "Language error"
                        )}
                    </b>

                    <br><br>

                    ❌ Your text:
                    <span class="wrong-text">
                        ${escapeHTML(
                            wrongText || "—"
                        )}
                    </span>

                    <br><br>

                    ✅ Suggested:
                    <span class="suggestion">
                        ${escapeHTML(
                            suggestions
                        )}
                    </span>

                </div>

            `;

        }
    );


    html += `
        </div>
    `;

    return html;

}


/* =====================================================
   CHECK CURRENT QUESTION
===================================================== */

async function checkCurrentQuestion(){

    if(
        !examActive ||
        antiCheatLocked ||
        answered
    ){

        return;

    }


    const item =
        examQuestions[currentQuestion];

    const correctWord =
        item[0];


    const vocabAnswer =
        document
            .getElementById(
                "vocabAnswer"
            )
            .value
            .trim();


    const sentence =
        document
            .getElementById(
                "sentenceAnswer"
            )
            .value
            .trim();


    if(!vocabAnswer){

        alert(
            "Please enter the English vocabulary."
        );

        return;

    }


    if(!sentence){

        alert(
            "Please write an English sentence."
        );

        return;

    }


    const feedback =
        document
            .getElementById(
                "questionFeedback"
            );


    feedback
        .classList
        .remove("hidden");


    feedback.innerHTML =
        "⏳ Checking your answer...";


    const vocabCorrect =
        checkVocabulary(
            vocabAnswer,
            correctWord
        );


    let sentenceCorrect = false;
    let grammarMatches = [];


    try{

        const languageData =
            await grammarCheck(
                sentence
            );


        grammarMatches =
            Array.isArray(
                languageData.matches
            )
                ? languageData.matches
                : [];


        const normalizedSentence =
            normalize(sentence);

        const normalizedWord =
            normalize(correctWord);


        const wordIncluded =
            normalizedSentence.includes(
                normalizedWord
            );


        sentenceCorrect =
            wordIncluded &&
            grammarMatches.length === 0;


    }catch(error){

        feedback.innerHTML = `

            <p class="incorrect">
                ❌ LanguageTool tekshiruvi ishlamadi.
            </p>

            <p>
                ${escapeHTML(
                    error.message
                )}
            </p>

            <p>
                Internet connectionni tekshiring
                va qayta urinib ko‘ring.
            </p>

        `;

        return;

    }


    answered = true;


    if(vocabCorrect){

        vocabScore++;

    }


    if(sentenceCorrect){

        sentenceScore++;

    }


    totalScore =
        vocabScore +
        sentenceScore;


    let html = "";


    /* VOCAB RESULT */

    if(vocabCorrect){

        html += `

            <p class="correct">
                ✅ Vocabulary: +1 point
            </p>

        `;

    }else{

        html += `

            <p class="incorrect">
                ❌ Vocabulary: 0 points
            </p>

            <p>
                Correct answer:
                <b>
                    ${escapeHTML(
                        correctWord
                    )}
                </b>
            </p>

        `;

    }


    /* SENTENCE RESULT */

    if(sentenceCorrect){

        html += `

            <p class="correct">
                ✅ Sentence: +1 point
            </p>

            <p class="correct">
                🎉 No LanguageTool errors.
            </p>

        `;

    }else{

        html += `

            <p class="incorrect">
                ❌ Sentence: 0 points
            </p>

        `;


        if(
            !normalize(sentence)
                .includes(
                    normalize(correctWord)
                )
        ){

            html += `

                <p class="incorrect">
                    ⚠️ Your sentence does not
                    contain the required vocabulary.
                </p>

            `;

        }


        /* SHOW ACTUAL LANGUAGE TOOL ERRORS */

        html +=
            createGrammarDetails(
                sentence,
                grammarMatches
            );

    }


    html += `

        <hr>

        <p>
            <b>Current score:</b>
            ${totalScore}
            /
            ${QUESTION_COUNT * 2}
        </p>

    `;


    feedback.innerHTML =
        html;


    document
        .getElementById("checkButton")
        .classList
        .add("hidden");

    document
        .getElementById("nextButton")
        .classList
        .remove("hidden");

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    if(!examActive){
        return;
    }

    if(!answered){

        alert(
            "First check your answer."
        );

        return;

    }


    if(
        currentQuestion <
        examQuestions.length - 1
    ){

        currentQuestion++;

        showQuestion();

    }else{

        finishExam(
            "🎉 Exam completed!"
        );

    }

}


/* =====================================================
   FINISH
===================================================== */

function finishExam(message){

    if(!examActive){
        return;
    }

    examActive = false;

    clearInterval(timer);

    document.body.classList.remove(
        "exam-mode"
    );


    document
        .getElementById("examPage")
        .classList
        .add("hidden");


    document
        .getElementById("resultPage")
        .classList
        .remove("hidden");


    const maxScore =
        QUESTION_COUNT * 2;


    const percentage =
        Math.round(
            (totalScore /
             maxScore) *
             100
        );


    document
        .getElementById("totalScore")
        .textContent =
        `${totalScore}/${maxScore}`;


    document
        .getElementById("percentage")
        .textContent =
        `${percentage}%`;


    document
        .getElementById("resultLesson")
        .textContent =
        selectedLesson;


    document
        .getElementById("vocabScore")
        .textContent =
        `${vocabScore}/${QUESTION_COUNT}`;


    document
        .getElementById("sentenceScore")
        .textContent =
        `${sentenceScore}/${QUESTION_COUNT}`;

}

   NEW EXAM

    );

/* =====================================================
   REVIEW
===================================================== */

function openReview(lesson){

    const modal =
        document.getElementById(
            "reviewModal"
        );

    const title =
        document.getElementById(
            "reviewTitle"
        );

    const content =
        document.getElementById(
            "reviewContent"
        );


    title.textContent =
        "📖 " + lesson;


    content.innerHTML = "";


    lessons[lesson].forEach(
        (item,index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "review-item";


            div.innerHTML = `

                <div class="review-en">
                    ${index + 1}.
                    ${escapeHTML(item[0])}
                </div>

                <div class="review-uz">
                    ${escapeHTML(item[1])}
                </div>

            `;


            content.appendChild(div);

        }
    );


    modal.classList.remove(
        "hidden"
    );

}


function closeReview(event){

    if(
        event &&
        event.target !==
        document.getElementById(
            "reviewModal"
        )
    ){

        return;

    }


    document
        .getElementById(
            "reviewModal"
        )
        .classList
        .add("hidden");

}


/* =====================================================
   DARK / LIGHT
===================================================== */

function toggleTheme(){

    document
        .body
        .classList
        .toggle("dark");


    localStorage.setItem(
        "vocabTheme",

        document.body.classList.contains(
            "dark"
        )
            ? "dark"
            : "light"
    );

}


function loadTheme(){

    if(
        localStorage.getItem(
            "vocabTheme"
        ) === "dark"
    ){

        document
            .body
            .classList
            .add("dark");

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ANTI-CHEAT
===================================================== */

function cancelForCheating(){

    if(
        !examActive ||
        antiCheatLocked
    ){

        return;

    }


    antiCheatLocked = true;
    examActive = false;

    clearInterval(timer);


    document.body.classList.remove(
        "exam-mode"
    );


    alert(
        "❌ EXAM CANCELLED!\n\n" +
        "The page lost focus or visibility."
    );


    document
        .getElementById("examPage")
        .classList
        .add("hidden");


    document
        .getElementById("resultPage")
        .classList
        .add("hidden");


    document
        .getElementById("lessonPage")
        .classList
        .remove("hidden");

}


/* Visibility */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.hidden &&
            examActive
        ){

            cancelForCheating();

        }

    }
);


/* Blur */

window.addEventListener(
    "blur",
    () => {

        if(examActive){

            setTimeout(() => {

                if(
                    examActive &&
                    !document.hasFocus()
                ){

                    cancelForCheating();

                }

            },150);

        }

    }
);


/* Page hide */

window.addEventListener(
    "pagehide",
    () => {

        if(examActive){

            cancelForCheating();

        }

    }
);


/* Orientation */

window.addEventListener(
    "orientationchange",
    () => {

        if(examActive){

            cancelForCheating();

        }

    }
);


/* Periodic check */

setInterval(() => {

    if(
        examActive &&
        (
            document.hidden ||
            !document.hasFocus()
        )
    ){

        cancelForCheating();

    }

},1000);


/* =====================================================
   INITIALIZE
===================================================== */

buildLessons();

loadTheme();

</script>
