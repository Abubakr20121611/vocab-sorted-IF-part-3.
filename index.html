<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Vocabulary Exam</title>

<style>
:root{
    --bg:#eef3f8;
    --card:#ffffff;
    --text:#172033;
    --primary:#2563eb;
    --border:#dbe3ee;
    --soft:#f5f8fc;
    --danger:#dc2626;
    --success:#16a34a;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

body.dark{
    --bg:#111827;
    --card:#1f2937;
    --text:#f3f4f6;
    --border:#374151;
    --soft:#273449;
}

.container{
    max-width:950px;
    width:94%;
    margin:25px auto;
}

.card{
    background:var(--card);
    padding:28px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    margin-bottom:20px;
}

.hidden{
    display:none!important;
}

.center{
    text-align:center;
}

h1,h2,h3{
    margin-top:0;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.brand{
    font-size:20px;
    font-weight:bold;
    color:var(--primary);
}

.theme-btn{
    background:var(--soft);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 13px;
    cursor:pointer;
    font-size:18px;
}

.telegram{
    margin:20px 0;
    padding:12px 16px;
    border-radius:12px;
    background:#e8f3ff;
    text-align:center;
    font-weight:bold;
}

.telegram a{
    color:#1687d9;
    text-decoration:none;
}

.telegram svg{
    width:18px;
    height:18px;
    vertical-align:middle;
    margin-right:5px;
}

.lesson-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.lesson-row{
    display:grid;
    grid-template-columns:1fr 55px;
    align-items:center;
    border:2px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    background:var(--soft);
}

.lesson-name{
    padding:16px;
    font-weight:bold;
    cursor:pointer;
}

.lesson-name:hover{
    color:var(--primary);
}

.review-btn{
    height:100%;
    border:0;
    border-left:2px solid var(--border);
    background:transparent;
    cursor:pointer;
    font-size:20px;
}

.review-btn:hover{
    background:rgba(37,99,235,.1);
}

.exam-header{
    text-align:center;
}

.progress{
    font-weight:bold;
    margin:10px 0;
}

.timer{
    font-size:30px;
    font-weight:bold;
    color:var(--primary);
    margin:10px 0 20px;
}

.meaning{
    background:var(--soft);
    border-left:5px solid var(--primary);
    padding:15px;
    border-radius:10px;
    margin:15px 0;
    font-size:18px;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:2px solid var(--border);
    border-radius:12px;
    background:var(--card);
    color:var(--text);
    font-size:16px;
    outline:none;
}

textarea{
    min-height:150px;
    resize:vertical;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 7px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 19px;
    margin:5px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.primary{
    background:var(--primary);
    color:white;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

body.dark .secondary{
    background:#374151;
    color:white;
}

.button-area{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:15px;
}

.feedback{
    margin-top:20px;
    padding:18px;
    border-radius:14px;
    background:var(--soft);
    line-height:1.7;
}

.correct{
    color:var(--success);
    font-weight:bold;
}

.wrong{
    color:var(--danger);
    font-weight:bold;
}

.grammar-error{
    margin:12px 0;
    padding:14px;
    border-left:4px solid var(--danger);
    background:rgba(220,38,38,.08);
    border-radius:8px;
}

.wrong-text{
    font-weight:bold;
    color:var(--danger);
}

.suggestions{
    margin-top:7px;
}

.score{
    font-size:42px;
    font-weight:bold;
    color:var(--primary);
    text-align:center;
}

.result-box{
    background:var(--soft);
    padding:18px;
    border-radius:14px;
    margin:10px 0;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.modal-content{
    max-width:700px;
    width:100%;
    max-height:85vh;
    overflow:auto;
    background:var(--card);
    color:var(--text);
    border-radius:20px;
    padding:25px;
}

.word-item{
    padding:12px 0;
    border-bottom:1px solid var(--border);
}

.word-item b{
    color:var(--primary);
}

.cancel-warning{
    color:var(--danger);
    font-weight:bold;
    text-align:center;
    margin-top:10px;
}

@media(max-width:600px){

    .container{
        width:96%;
        margin:12px auto;
    }

    .card{
        padding:20px;
    }

    .topbar{
        align-items:flex-start;
    }

    .button-area{
        flex-direction:column;
    }

    button{
        width:100%;
        margin:4px 0;
    }

    .timer{
        font-size:25px;
    }

}
</style>
</head>

<body>

<div class="container">

<!-- LESSON PAGE -->

<div id="lessonPage" class="card">

    <div class="topbar">
        <div class="brand">📚 IELTS Vocabulary Exam</div>

        <button
            class="theme-btn"
            onclick="toggleTheme()"
            title="Change theme">
            🌙
        </button>
    </div>

    <h1 class="center">Choose a Lesson</h1>

    <div class="telegram">
        <a
            href="https://t.me/Ieltsmaterialsbyabubakr"
            target="_blank">

            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M21.8 3.2L18.7 20c-.2 1.2-.9 1.5-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6.1 13.5l-4.9-1.6c-1.1-.3-1.1-1.1.2-1.6L20.5 2c.9-.3 1.7.2 1.3 1.2z"/>
            </svg>

            @IeltsmaterialsbyAbubakr
        </a>
    </div>

    <div id="lessonList" class="lesson-list"></div>

</div>


<!-- EXAM PAGE -->

<div id="examPage" class="card hidden">

    <div class="exam-header">

        <div class="brand">
            📚 IELTS Vocabulary Exam
        </div>

        <h2 id="examLesson"></h2>

        <div id="questionCounter" class="progress"></div>

        <div id="timer" class="timer">
            15:00
        </div>

    </div>

    <div id="wordBox"></div>

    <label>
        English vocabulary:
    </label>

    <input
        id="vocabInput"
        autocomplete="off"
        placeholder="Type the English word or phrase"
    >

    <label>
        Your English sentence:
    </label>

    <textarea
        id="sentenceInput"
        placeholder="Write an English sentence using the vocabulary..."
    ></textarea>

    <div class="button-area">

        <button
            class="primary"
            onclick="checkCurrentQuestion()">
            ✅ CHECK
        </button>

        <button
            class="secondary"
            onclick="nextQuestion()">
            ➡️ NEXT
        </button>

    </div>

    <div id="questionFeedback"></div>

    <p class="cancel-warning">
        ⚠️ Leaving this tab/window will cancel the exam.
    </p>

</div>


<!-- RESULT PAGE -->

<div id="resultPage" class="card hidden">

    <div class="center">

        <h1>🏆 Exam Completed</h1>

        <div id="finalScore" class="score"></div>

    </div>

    <div id="resultDetails"></div>

    <div class="button-area">

        <button
            class="primary"
            onclick="newExam()">
            🔄 NEW EXAM
        </button>

    </div>

</div>

</div>


<!-- REVIEW MODAL -->

<div
    id="reviewModal"
    class="modal hidden"
    onclick="closeReviewOutside(event)">

    <div class="modal-content">

        <div class="topbar">

            <h2 id="reviewTitle"></h2>

            <button
                class="secondary"
                onclick="closeReview()">
                ✕
            </button>

        </div>

        <div id="reviewWords"></div>

    </div>

</div>

/* =====================================================
   SETTINGS
===================================================== */

const QUESTION_COUNT = 15;
const EXAM_TIME = 15 * 60;

let selectedLesson = "";
let questions = [];
let currentQuestion = 0;

let vocabScore = 0;
let sentenceScore = 0;

let checkedQuestions = 0;

let timeLeft = EXAM_TIME;
let timerInterval = null;

let examActive = false;
let examCancelled = false;


/* =====================================================
   BUILD LESSONS
===================================================== */

function buildLessons(){

    const list =
        document.getElementById("lessonList");

    list.innerHTML = "";

    Object.keys(lessons).forEach(lesson => {

        const row =
            document.createElement("div");

        row.className = "lesson-row";

        const name =
            document.createElement("div");

        name.className = "lesson-name";

        name.textContent =
            lesson;

        name.onclick = () =>
            startExam(lesson);


        const review =
            document.createElement("button");

        review.className = "review-btn";

        review.innerHTML = "📖";

        review.title =
            "Review vocabulary";

        review.onclick = (event) => {

            event.stopPropagation();

            openReview(lesson);

        };


        row.appendChild(name);
        row.appendChild(review);

        list.appendChild(row);

    });

}


/* =====================================================
   REVIEW
===================================================== */

function openReview(lesson){

    document
        .getElementById("reviewModal")
        .classList
        .remove("hidden");

    document
        .getElementById("reviewTitle")
        .textContent =
        lesson + " Vocabulary";

    const box =
        document.getElementById("reviewWords");

    box.innerHTML = "";

    lessons[lesson].forEach((item,index)=>{

        const div =
            document.createElement("div");

        div.className =
            "word-item";

        div.innerHTML =
            `<b>${index+1}. ${escapeHTML(item[0])}</b>
             <br>
             ${escapeHTML(item[1])}`;

        box.appendChild(div);

    });

}


function closeReview(){

    document
        .getElementById("reviewModal")
        .classList
        .add("hidden");

}


function closeReviewOutside(event){

    if(
        event.target.id === "reviewModal"
    ){

        closeReview();

    }

}


/* =====================================================
   START EXAM
===================================================== */

function startExam(lesson){

    selectedLesson = lesson;

    questions =
        getRandomQuestions(
            lessons[lesson],
            QUESTION_COUNT
        );

    currentQuestion = 0;

    vocabScore = 0;
    sentenceScore = 0;
    checkedQuestions = 0;

    timeLeft = EXAM_TIME;

    examActive = true;
    examCancelled = false;

    document
        .getElementById("lessonPage")
        .classList
        .add("hidden");

    document
        .getElementById("examPage")
        .classList
        .remove("hidden");

    document
        .getElementById("resultPage")
        .classList
        .add("hidden");

    document.body.classList.add("exam-mode");

    document
        .getElementById("examLesson")
        .textContent =
        selectedLesson;

    updateTimer();

    loadQuestion();

    startTimer();

}


/* =====================================================
   RANDOM QUESTIONS
===================================================== */

function getRandomQuestions(array,count){

    return [...array]
        .sort(() => Math.random() - 0.5)
        .slice(0,count);

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

    const item =
        questions[currentQuestion];

    document
        .getElementById("questionCounter")
        .textContent =
        `Question ${currentQuestion+1} / ${QUESTION_COUNT}`;

    document
        .getElementById("wordBox")
        .innerHTML = `

        <div class="meaning">

            <b>🇺🇿 Uzbek:</b>
            ${escapeHTML(item[1])}

        </div>

        `;

    document
        .getElementById("vocabInput")
        .value = "";

    document
        .getElementById("sentenceInput")
        .value = "";

    document
        .getElementById("questionFeedback")
        .innerHTML = "";

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(){

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;

    document
        .getElementById("timer")
        .textContent =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}


function startTimer(){

    clearInterval(timerInterval);

    timerInterval =
        setInterval(()=>{

            if(
                !examActive ||
                examCancelled
            ){

                clearInterval(timerInterval);

                return;

            }

            timeLeft--;

            updateTimer();

            if(timeLeft <= 0){

                clearInterval(timerInterval);

                finishExam();

            }

        },1000);

}


/* =====================================================
   CHECK QUESTION
===================================================== */

async function checkCurrentQuestion(){

    if(
        !examActive ||
        examCancelled
    ){

        return;

    }

    const item =
        questions[currentQuestion];

    const correctWord =
        item[0].trim().toLowerCase();

    const userWord =
        document
            .getElementById("vocabInput")
            .value
            .trim()
            .toLowerCase();

    const sentence =
        document
            .getElementById("sentenceInput")
            .value
            .trim();


    if(!userWord){

        alert("Enter the English vocabulary.");

        return;

    }


    if(!sentence){

        alert("Write an English sentence.");

        return;

    }


    let vocabCorrect =
        userWord === correctWord;

    if(vocabCorrect){

        vocabScore++;

    }


    const feedback =
        document
            .getElementById("questionFeedback");

    feedback.innerHTML =
        "⏳ Checking your sentence with LanguageTool...";


    let grammarMatches = [];

    try{

        grammarMatches =
            await grammarCheck(sentence);

    }catch(error){

        feedback.innerHTML = `
            <p class="wrong">
                ❌ LanguageTool error
            </p>
            <p>
                ${escapeHTML(error.message)}
            </p>
        `;

        return;

    }


    const wordIncluded =
        containsRequiredVocabulary(
            sentence,
            item[0]
        );


    const sentenceCorrect =
        wordIncluded &&
        grammarMatches.length === 0;


    if(sentenceCorrect){

        sentenceScore++;

    }


    checkedQuestions++;


    let html = "";

    html += vocabCorrect
        ? `<p class="correct">✅ Vocabulary: +1 point</p>`
        : `
            <p class="wrong">
                ❌ Vocabulary: 0 point
                <br>
                Correct answer:
                <b>${escapeHTML(item[0])}</b>
            </p>
          `;


    if(!wordIncluded){

        html += `
            <div class="grammar-error">

                <b>❌ Required vocabulary was not used in the sentence.</b>

                <p>
                You must use:
                <span class="wrong-text">
                ${escapeHTML(item[0])}
                </span>
                </p>

            </div>
        `;

    }


    if(grammarMatches.length === 0){

        html += `
            <p class="correct">
                ✅ LanguageTool: No grammar or spelling errors found.
            </p>
        `;

    }else{

        html += `
            <p class="wrong">
                ❌ LanguageTool found
                ${grammarMatches.length}
                issue(s):
            </p>
        `;

        html += createGrammarDetails(
            sentence,
            grammarMatches
        );

    }


    html += sentenceCorrect
        ? `<p class="correct">✅ Sentence: +1 point</p>`
        : `<p class="wrong">❌ Sentence: 0 point</p>`;


    feedback.innerHTML =
        html;

}


/* =====================================================
   LANGUAGE TOOL
===================================================== */

async function grammarCheck(sentence){

    const body =
        new URLSearchParams();

    body.append(
        "text",
        sentence
    );

    body.append(
        "language",
        "en-US"
    );


    const response =
        await fetch(
            "https://api.languagetool.org/v2/check",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:body.toString()
            }
        );


    if(!response.ok){

        throw new Error(
            "LanguageTool request failed."
        );

    }


    const data =
        await response.json();

    return data.matches || [];

}


/* =====================================================
   GRAMMAR DETAILS
===================================================== */

function createGrammarDetails(
    sentence,
    matches
){

    let html = "";

    matches
        .slice(0,5)
        .forEach((match,index)=>{

            const wrongText =
                sentence.substring(
                    match.offset,
                    match.offset + match.length
                );


            const suggestions =
                (match.replacements || [])
                .slice(0,5)
                .map(
                    r => r.value
                );


            html += `

            <div class="grammar-error">

                <b>
                    ${index+1}. ${escapeHTML(match.message || "Error")}
                </b>

                <p>
                    Wrong text:
                    <span class="wrong-text">
                        "${escapeHTML(wrongText)}"
                    </span>
                </p>

                ${
                    suggestions.length
                    ?
                    `
                    <div class="suggestions">
                        <b>Possible correction:</b>
                        ${suggestions
                            .map(
                                s =>
                                `<span>
                                    ${escapeHTML(s)}
                                </span>`
                            )
                            .join(", ")}
                    </div>
                    `
                    :
                    `<p>No replacement suggestion.</p>`
                }

            </div>

            `;

        });


    if(matches.length > 5){

        html += `
            <p>
                Showing first 5 errors.
                Total errors:
                ${matches.length}
            </p>
        `;

    }


    return html;

}


/* =====================================================
   VOCABULARY IN SENTENCE
===================================================== */

function containsRequiredVocabulary(
    sentence,
    vocabulary
){

    const cleanSentence =
        sentence
            .toLowerCase()
            .replace(/[.,!?;:"'()]/g," ");

    const cleanVocabulary =
        vocabulary
            .toLowerCase()
            .replace(/[.,!?;:"'()]/g," ")
            .trim();


    return cleanSentence
        .includes(cleanVocabulary);

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    if(
        !examActive ||
        examCancelled
    ){

        return;

    }


    if(
        checkedQuestions <= currentQuestion
    ){

        alert(
            "First check this question."
        );

        return;

    }


    if(
        currentQuestion <
        QUESTION_COUNT - 1
    ){

        currentQuestion++;

        loadQuestion();

    }else{

        finishExam();

    }

}


/* =====================================================
   FINISH EXAM
===================================================== */

function finishExam(){

    if(!examActive) return;

    examActive = false;

    clearInterval(timerInterval);

    document.body.classList.remove("exam-mode");

    document
        .getElementById("examPage")
        .classList
        .add("hidden");

    document
        .getElementById("resultPage")
        .classList
        .remove("hidden");


    const total =
        vocabScore + sentenceScore;

    const percentage =
        Math.round(
            (total / 30) * 100
        );


    document
        .getElementById("finalScore")
        .textContent =
        `${total} / 30 (${percentage}%)`;


    document
        .getElementById("resultDetails")
        .innerHTML = `

        <div class="result-box">
            <b>📚 Lesson:</b>
            ${escapeHTML(selectedLesson)}
        </div>

        <div class="result-box">
            <b>🔤 Vocabulary score:</b>
            ${vocabScore} / 15
        </div>

        <div class="result-box">
            <b>✍️ Sentence score:</b>
            ${sentenceScore} / 15
        </div>

        <div class="result-box">
            <b>🏆 Total:</b>
            ${total} / 30
        </div>

        <div class="result-box">
            <b>📊 Percentage:</b>
            ${percentage}%
        </div>

        `;

}


/* =====================================================
   NEW EXAM
===================================================== */

function newExam(){

    clearInterval(timerInterval);

    examActive = false;
    examCancelled = false;

    questions = [];
    currentQuestion = 0;

    vocabScore = 0;
    sentenceScore = 0;
    checkedQuestions = 0;

    timeLeft = EXAM_TIME;

    document
        .getElementById("resultPage")
        .classList
        .add("hidden");

    document
        .getElementById("examPage")
        .classList
        .add("hidden");

    document
        .getElementById("lessonPage")
        .classList
        .remove("hidden");

}


/* =====================================================
   ANTI-CHEAT
===================================================== */

function cancelExam(){

    if(
        !examActive ||
        examCancelled
    ){

        return;

    }


    examCancelled = true;
    examActive = false;

    clearInterval(timerInterval);

    document.body.classList.remove("exam-mode");

    document
        .getElementById("examPage")
        .classList
        .add("hidden");

    document
        .getElementById("lessonPage")
        .classList
        .remove("hidden");

    alert(
        "❌ Exam cancelled.\n\n" +
        "The exam was cancelled because you left the exam window or tab."
    );

}


/* Tab change */
document.addEventListener(
    "visibilitychange",
    ()=>{

        if(document.hidden){

            cancelExam();

        }

    }
);


/* Window loses focus */
window.addEventListener(
    "blur",
    ()=>{

        if(examActive){

            cancelExam();

        }

    }
);


/* Page hidden */
window.addEventListener(
    "pagehide",
    ()=>{

        if(examActive){

            cancelExam();

        }

    }
);


/* Orientation change */
window.addEventListener(
    "orientationchange",
    ()=>{

        if(examActive){

            cancelExam();

        }

    }
);


/* =====================================================
   THEME
===================================================== */

function toggleTheme(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "vocabTheme",
        document.body.classList.contains("dark")
        ? "dark"
        : "light"
    );

}


function loadTheme(){

    const theme =
        localStorage.getItem(
            "vocabTheme"
        );

    if(theme === "dark"){

        document.body.classList.add("dark");

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   INITIAL
===================================================== */

buildLessons();
loadTheme();
